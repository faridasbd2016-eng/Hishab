<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a3d2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="আমার হিসাব">
<title>আমার হিসাব</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= ডিজাইন টোকেন ================= */
:root{
  --bg:#f3f5f4;--sf:#ffffff;--sf2:#f6f8f7;--sf3:#eef2f0;--tx:#0f1a14;--tx2:#3b4a42;--mu:#6b7a72;--bd:#e3e9e5;
  --pr:#0b5a3c;--pr2:#13774f;--prd:#082f20;--prs:#e7f2ec;--prt:#0b6b45;
  --ac:#f2a900;--ac2:#ffc93c;--acs:#fff5da;--act:#5a3f00;
  --red:#cf3f3f;--reds:#fdecec;--grn:#12895a;--grns:#e6f4ec;
  --plan:#a8cfe2;--actl:#f2b07a;
  --sh1:0 1px 2px rgba(10,40,25,.05),0 1px 1px rgba(10,40,25,.03);
  --sh2:0 10px 30px -12px rgba(8,47,32,.35);
  --r:16px;color-scheme:light}
:root[data-theme="dark"]{--bg:#0b100e;--sf:#141b18;--sf2:#18211d;--sf3:#1d2823;--tx:#e8eeea;--tx2:#c3cec8;--mu:#8c9c94;--bd:#25312b;--prs:#14301f;--prt:#5fd394;--acs:#3a2f12;--act:#ffd77a;--reds:#3a1717;--grns:#12301f;--red:#ff6b6b;--grn:#3ccf7f;--plan:#4b86a5;--actl:#cf8a52;--sh1:none;--sh2:0 10px 30px -12px rgba(0,0,0,.7);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b100e;--sf:#141b18;--sf2:#18211d;--sf3:#1d2823;--tx:#e8eeea;--tx2:#c3cec8;--mu:#8c9c94;--bd:#25312b;--prs:#14301f;--prt:#5fd394;--acs:#3a2f12;--act:#ffd77a;--reds:#3a1717;--grns:#12301f;--red:#ff6b6b;--grn:#3ccf7f;--plan:#4b86a5;--actl:#cf8a52;--sh1:none;--sh2:0 10px 30px -12px rgba(0,0,0,.7);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri",system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:var(--tx)}
.num,.mv{font-variant-numeric:tabular-nums}
.hideamt .mv{filter:blur(7px);user-select:none}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic.s{width:16px;height:16px}.ic.l{width:24px;height:24px}
.muted{color:var(--mu)}.pos{color:var(--grn)}.neg{color:var(--red)}
/* ================= হেডার ================= */
header{position:sticky;top:0;z-index:30;background:var(--prd);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px}
header:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:rgba(255,255,255,.06)}
.hrow,.mbar{max-width:560px;margin:0 auto}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.htl small{display:block;font-size:12px;color:rgba(255,255,255,.65);line-height:1.2}
.htl h1{font-size:19px;margin:0;font-weight:700;line-height:1.35;letter-spacing:.1px}
.htl h1 span{color:var(--ac2)}
.hbtns{display:flex;gap:8px}
.ibtn{position:relative;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center}
.ibtn:active{background:rgba(255,255,255,.16)}
.sdot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:transparent;border:1.5px solid var(--prd)}
.sdot.ok{background:#4ade80}.sdot.busy{background:var(--ac);animation:pulse 1s infinite}.sdot.err{background:#ff6b6b}.sdot.off{background:#94a3b8}
.sdot.inl{position:static;display:inline-block;border:0;vertical-align:1px;margin-right:6px}
@keyframes pulse{50%{opacity:.35}}
.mbar{display:flex;align-items:center;justify-content:space-between;margin-top:10px;background:rgba(255,255,255,.07);border-radius:12px;height:40px;padding:0 4px}
.mbar button{width:40px;height:34px;border-radius:9px;color:#fff;display:grid;place-items:center}
.mbar button:active{background:rgba(255,255,255,.12)}
.mbar b{display:flex;align-items:center;gap:7px;font-weight:600;font-size:15px}
main{padding:14px 16px calc(100px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
main>*{animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
/* ================= কম্পোনেন্ট ================= */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh1)}
.card.flat{box-shadow:none;background:var(--sf2)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.ch h3{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.ch small,.ch .muted{font-size:12px;color:var(--mu)}
.hb{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.hb .ic{width:16px;height:16px}
.sech{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px}
.sech h2{margin:0;font-size:14px;font-weight:700;color:var(--tx2)}
.link{color:var(--prt);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:3px}
.note{font-size:12.5px;color:var(--mu);line-height:1.6}
.empty{text-align:center;color:var(--mu);padding:26px 12px;font-size:14px}
.empty .eico{width:52px;height:52px;border-radius:16px;background:var(--sf3);display:grid;place-items:center;margin:0 auto 10px;color:var(--mu)}
.bar{height:6px;background:var(--sf3);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:width .5s}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px}
.pill.g{background:var(--grns);color:var(--grn)}.pill.r{background:var(--reds);color:var(--red)}.pill.a{background:var(--acs);color:var(--act)}.pill.n{background:var(--sf3);color:var(--mu)}
/* হিরো */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px 18px 0;margin-bottom:12px;color:#fff;background:linear-gradient(150deg,#0e6a45 0%,#0a5136 45%,#073523 100%);box-shadow:var(--sh2)}
.hero:before{content:"";position:absolute;right:-60px;top:-80px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(255,201,60,.28),transparent 66%);pointer-events:none}
.hero:after{content:"";position:absolute;left:-40px;bottom:-120px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.04);pointer-events:none}
.hr1{display:flex;justify-content:space-between;align-items:center;position:relative}
.hr1 span{font-size:13px;color:rgba(255,255,255,.75)}
.eye{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}
.hbig{position:relative;font-size:32px;font-weight:700;margin:2px 0 14px;letter-spacing:.2px}
.hbig.neg{color:#ffc9c4}
.hgrid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(255,255,255,.12);margin:0 -18px}
.hgrid div{padding:11px 12px 13px;min-width:0}
.hgrid div+div{border-left:1px solid rgba(255,255,255,.12)}
.hgrid small{display:flex;align-items:center;gap:4px;font-size:11.5px;color:rgba(255,255,255,.7)}
.hgrid b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* অ্যাকাউন্ট স্ট্রিপ */
.accs{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 4px;padding:2px 16px 8px;scrollbar-width:none}
.accs::-webkit-scrollbar{display:none}
.accc{flex:none;min-width:138px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:11px 12px;text-align:left;box-shadow:var(--sh1)}
.accc .ai{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--prs);color:var(--prt);margin-bottom:6px;font-size:16px}
.accc small{display:block;color:var(--mu);font-size:12px}
.accc b{font-size:15px;font-weight:700}
.accc.add{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:96px;color:var(--prt);font-weight:600;font-size:13px;border-style:dashed;box-shadow:none;gap:4px}
/* কুইক অ্যাকশন */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--tx2);padding:4px 0}
.qa i{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;border:1px solid var(--bd);background:var(--sf);box-shadow:var(--sh1)}
.qa button:active i{transform:scale(.94)}
/* স্ট্যাট */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;box-shadow:var(--sh1);min-width:0}
.stat .sl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.stat .sv{font-size:17px;font-weight:700;margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .ss{font-size:11.5px;color:var(--mu)}
/* লেনদেন */
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.tx:last-child{border-bottom:0}
.ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.tm{flex:1;min-width:0}
.tm b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm small{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta{font-weight:700;white-space:nowrap;font-size:14.5px}
.dh{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);font-weight:600;padding:12px 0 2px;border-bottom:1px solid var(--bd)}
.search{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:0 12px;margin-bottom:10px;box-shadow:var(--sh1);color:var(--mu)}
.search input{flex:1;border:0;outline:0;background:none;padding:12px 0;font-size:15px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:7px 12px;white-space:nowrap;font-size:13px;color:var(--tx2)}
.chip .ic{width:15px;height:15px}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.chip.add{border-style:dashed;color:var(--prt)}
.sumline{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin:2px 0 12px;align-items:center;font-size:12px;color:var(--mu)}
.sumline b{display:block;font-size:15px}
/* বাজেট */
.brow{display:grid;grid-template-columns:1fr 100px 84px;gap:8px;align-items:center;padding:9px 0 7px;border-bottom:1px solid var(--bd);cursor:pointer}
.brow:last-of-type{border-bottom:0}
.brow .bn{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bpl{padding:6px 9px;border:1px solid var(--bd);border-radius:9px;text-align:right;background:var(--sf2);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden}
.brow .ba{text-align:right;font-size:13px;font-weight:600}
.brow .bar{grid-column:1/-1;height:4px}
.bhead{display:grid;grid-template-columns:1fr 100px 84px;gap:8px;font-size:11px;color:var(--mu);text-align:right;padding-bottom:4px;border-bottom:1px solid var(--bd)}
.bhead span:first-child{text-align:left}
.over{color:var(--red)}
.hl{cursor:pointer}
.hl .hn{text-decoration:underline dotted var(--mu);text-underline-offset:3px}
/* রিপোর্ট */
.stmt{width:100%;border-collapse:collapse;font-size:14px}
.stmt td{padding:9px 0;border-bottom:1px solid var(--bd)}
.stmt td:last-child{text-align:right;font-weight:600;white-space:nowrap}
.stmt tr.tot td{border-top:2px solid var(--tx);border-bottom:0;font-weight:700;font-size:15.5px}
.stmt tr.sub td{color:var(--mu);font-size:13px}
table.grid{width:100%;border-collapse:collapse;font-size:12.5px}
.grid th,.grid td{padding:8px 4px;border-bottom:1px solid var(--bd);text-align:right}
.grid th:first-child,.grid td:first-child{text-align:left}
.grid th{color:var(--mu);font-weight:600;font-size:11.5px}
.grid tr.cat td{font-weight:700;background:var(--sf2)}
.grid tr.now td{background:var(--acs)}
.rbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.rbtns button{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);background:var(--sf);border-radius:12px;padding:11px 4px;font-weight:600;font-size:13px;box-shadow:var(--sh1)}
.rbtns button.pri{background:var(--pr);color:#fff;border-color:var(--pr)}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mu);margin-top:8px;flex-wrap:wrap}
.legend i,.dleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
canvas{width:100%;display:block}
.dleg{display:grid;gap:2px;margin-top:10px;font-size:13.5px}
.dleg>div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.dleg>div:last-child{border-bottom:0}
.dleg span:last-child{color:var(--mu);white-space:nowrap}
.ins{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}
.ins:last-child{border-bottom:0}
.ins .hb{margin-top:1px}
/* লক্ষ্য/ঋণ */
.goal{display:flex;gap:14px;align-items:center}
.ring{flex:none}
.gd{flex:1;min-width:0}
.gd b{font-size:15.5px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;margin-top:6px}
.kv span:nth-child(odd){color:var(--mu)}
.kv span:nth-child(even){text-align:right;font-weight:600}
.edit{display:inline-flex;align-items:center;gap:4px;background:var(--sf3);border-radius:9px;padding:5px 10px;font-size:12px;color:var(--tx2);font-weight:600}
.edit .ic{width:14px;height:14px}
details summary{cursor:pointer;color:var(--prt);font-weight:600;font-size:13px;margin-top:12px;list-style:none;display:flex;align-items:center;gap:4px}
details summary::-webkit-details-marker{display:none}
.warn{display:flex;gap:8px;background:var(--acs);color:var(--tx);border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:10px}
.addbig{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border:1.5px dashed var(--bd);border-radius:14px;color:var(--prt);font-weight:700;margin-bottom:12px;background:var(--sf)}
.mini{display:inline-flex;align-items:center;gap:5px;border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:700;background:var(--prs);color:var(--prt);white-space:nowrap}
.mini.ac{background:var(--acs);color:var(--act)}
.minis{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* লিস্ট গ্রুপ (সেটিংস) */
.group{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--sh1);overflow:hidden}
.group .gt{font-size:12px;color:var(--mu);font-weight:600;padding:12px 14px 4px;text-transform:none}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--bd);cursor:pointer;width:100%;text-align:left}
.group .gt+.row,.group>.row:first-child{border-top:0}
.row .ri{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--sf3);color:var(--tx2);flex:none}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-weight:600;font-size:14.5px}
.row .rt small{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rv{color:var(--mu);font-size:13px;display:flex;align-items:center;gap:4px}
.row.red .ri{background:var(--reds);color:var(--red)}.row.red b{color:var(--red)}
.segs{display:flex;background:var(--sf3);border-radius:11px;padding:3px;gap:3px}
.segs button{flex:1;border-radius:9px;padding:8px 4px;font-size:13px;color:var(--tx2);display:flex;align-items:center;justify-content:center;gap:6px}
.segs button.on{background:var(--sf);box-shadow:var(--sh1);font-weight:700;color:var(--tx)}
.sw{position:relative;width:46px;height:28px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--bd);border-radius:28px;transition:.2s}
.sw span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--pr2)}
.sw input:checked+span:before{transform:translateX(18px)}
ol.steps{padding-left:20px;margin:6px 0;font-size:13.5px;line-height:1.75}
/* নেভিগেশন */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sf);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav .nw{max-width:560px;margin:0 auto;display:flex;align-items:flex-end}
nav .nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mu);padding:4px 0}
nav .nb .ic{width:22px;height:22px}
nav .nb.on{color:var(--prt);font-weight:700}
nav .nb.on .ib{background:var(--prs)}
nav .ib{width:52px;height:28px;border-radius:14px;display:grid;place-items:center;transition:background .2s}
nav .fabw{flex:1;display:flex;justify-content:center}
.fab{width:58px;height:58px;margin-top:-28px;border-radius:18px;background:linear-gradient(145deg,var(--ac2),var(--ac));color:#3d2a00;display:grid;place-items:center;box-shadow:0 8px 18px -4px rgba(242,169,0,.55);border:4px solid var(--bg)}
.fab .ic{width:28px;height:28px;stroke-width:2.4}
.fab:active{transform:scale(.93)}
/* শিট */
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(4,14,9,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
.sheet{background:var(--sf);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:su .22s ease-out}
.grab{width:40px;height:4px;background:var(--bd);border-radius:4px;margin:4px auto 10px}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.shead h2{font-size:17px;margin:0;display:flex;align-items:center;gap:8px}
.x{width:34px;height:34px;border-radius:10px;background:var(--sf3);display:grid;place-items:center;color:var(--tx2);flex:none}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(40px);opacity:.5}}
.amt{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--pr2);margin:6px 0 4px}
.amt span{font-size:26px;color:var(--mu);font-weight:600}
.amt input{border:0;outline:0;font-size:34px;font-weight:700;width:100%;padding:4px 0;background:none;font-variant-numeric:tabular-nums}
.amthint{font-size:12px;color:var(--mu);min-height:18px;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.seg button{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--bd);background:var(--sf);border-radius:12px;padding:8px 2px;font-size:12px;line-height:1.25;color:var(--tx2)}
.seg button .ic{width:18px;height:18px;color:var(--cc)}
.seg button.on{background:var(--cc);color:#fff;border-color:var(--cc);font-weight:700}
.seg button.on .ic{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fl{display:block;font-size:12px;color:var(--mu);margin:0 0 6px;font-weight:600}
.fi{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:12px;background:var(--sf2);outline:0}
.fi:focus{border-color:var(--pr2);background:var(--sf)}
.fi.sm{padding:9px 11px;margin-bottom:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:13px;border-radius:13px;border:1px solid var(--bd);background:var(--sf);font-weight:700;font-size:14.5px}
.btn.pri{background:var(--pr);color:#fff;border-color:var(--pr)}
.btn.gold{background:linear-gradient(145deg,var(--ac2),var(--ac));color:#3d2a00;border:0}
.btn.del{color:var(--red);border-color:var(--red);flex:.55}
.btn:active{opacity:.85}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu button{border:1px solid var(--bd);background:var(--sf2);border-radius:16px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--tx2)}
.menu .hb{width:42px;height:42px;border-radius:13px}
.menu .hb .ic{width:21px;height:21px}
.hbars{display:flex;gap:6px;align-items:flex-end;height:112px;margin:6px 0 2px}
.hbars button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mu);gap:3px}
.hbars i{display:block;width:70%;min-height:3px;border-radius:6px 6px 2px 2px;background:var(--actl);opacity:.6}
.hbars button.on i{opacity:1;background:var(--pr2)}
.hbars button.on{color:var(--tx);font-weight:700}
.hrow2{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd);cursor:pointer;align-items:center}
.hrow2:last-child{border-bottom:0}
.hrow2 .hd{flex:none;width:44px;text-align:center;background:var(--sf3);border-radius:11px;padding:4px 0;line-height:1.15}
.hrow2 .hd b{display:block;font-size:17px}.hrow2 .hd small{font-size:10px;color:var(--mu)}
.hrow2 .hm{flex:1;min-width:0}.hrow2 .hm b{display:block;font-weight:600;overflow-wrap:anywhere}.hrow2 .hm small{color:var(--mu);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#14201a;color:#fff;padding:10px 16px;border-radius:12px;z-index:300;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:92vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%)}
/* লক */
.lock{position:fixed;top:0;right:0;bottom:0;left:0;z-index:200;background:linear-gradient(160deg,#0a3d2a,#073523);color:#fff;display:flex;align-items:center;justify-content:center;outline:0}
.lk{text-align:center;width:100%;max-width:320px;padding:20px}
.lklogo{width:70px;height:70px;margin:0 auto 12px;border-radius:22px;background:linear-gradient(145deg,var(--ac2),var(--ac));color:#3d2a00;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.lklogo .ic{width:32px;height:32px;stroke-width:2.2}
.lk h2{margin:4px 0 2px;font-size:20px}.lk p{margin:0 0 20px;color:rgba(255,255,255,.7)}
.dots{display:flex;gap:16px;justify-content:center;margin-bottom:28px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.8)}
.dots i.on{background:var(--ac2);border-color:var(--ac2)}
.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 20px}
.kp button{height:62px;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;font-size:24px;font-weight:600;display:grid;place-items:center}
.kp button:disabled{visibility:hidden}
.kp button:active{background:rgba(255,255,255,.22)}
.lkf{color:rgba(255,255,255,.65);margin-top:20px;font-size:13px}

function mergeData(a, b){
  a = a || {}; b = b || {};
  var out = {v:2, budget:{}, del:{}};
  var del = {}, k;
  [a.del || {}, b.del || {}].forEach(function(d){ for(k in d){ if(!(k in del) || d[k] > del[k]) del[k] = d[k]; } });
  var cut = Date.now() - 180*864e5;
  for(k in del){ if(del[k] < cut) delete del[k]; }
  ['txns','goals','loans','accs','recs'].forEach(function(col){
    var m = {};
    (a[col] || []).concat(b[col] || []).forEach(function(r){
      if(!r || !r.id) return; var x = m[r.id];
      if(!x || (r.u || 0) > (x.u || 0)) m[r.id] = r;
    });
    out[col] = Object.keys(m).map(function(id){ return m[id]; }).filter(function(r){ return !(del[r.id] >= (r.u || 0)); });
  });
  var ba = a.budget || {}, bb = b.budget || {};
  Object.keys(ba).concat(Object.keys(bb)).forEach(function(ym){
    var x = ba[ym], y = bb[ym];
    out.budget[ym] = !x ? y : !y ? x : ((y.u || 0) > (x.u || 0) ? y : x);
  });
  if((b.subsU || 0) > (a.subsU || 0)){ out.subs = b.subs; out.subsU = b.subsU; }
  else { out.subs = a.subs || b.subs; out.subsU = a.subsU || 0; }
  out.del = del; return out;
}

    if(m < tm) pay = act;
    else if(m === tm){ pay = act>0 ? act : Math.min(Ln.pay||0, open+int); cur = Math.max(0, act>0 ? open+int-act : open); }
    else pay = Math.min(Ln.pay||0, open+int);
    if(m >= tm && !act && (Ln.pay||0) <= int + 0.001){ never = true; bal = open; break; }
    bal = Math.max(0, open + int - pay);
    rows.push({m, plan:Ln.pay||0, act, got:add, bal, done:act>0});
    m = addM(m,1);
  }
  if(cur === null) cur = tm < start ? total : bal;
  const totPaid = Object.values(paid).reduce((a,b)=>a+b,0);
  const payoff = (!never && rows.length && rows[rows.length-1].bal <= 0.005) ? rows[rows.length-1].m : null;
  return {rows, cur, never, totPaid, payoff, total, pct: total>0 ? Math.min(1, Math.max(0,(total-cur)/total)) : 0};
}

function insights(m){
  const a = actual(m), p = planned(m), pv = actual(addM(m,-1)), out = [], tm = ymOf(today());
  if(!a.inc && !a.out) return out;

  if(psp > 0 && sp > 0){ const d = (sp - psp)/psp*100;
    out.push(Math.abs(d) < 1 ? ['chart', 'খরচ গত মাসের মতোই আছে', '#5a6f7a'] : d > 0 ? ['up', `গত মাসের চেয়ে খরচ <b class="neg">${Math.round(d)}% বেশি</b> (${mv(sp-psp)})`, '#d0463f'] : ['dn', `গত মাসের চেয়ে খরচ <b class="pos">${Math.round(-d)}% কম</b> — চমৎকার!`, '#15965a']); }
  if(a.inc > 0){ const sr = a.sav/a.inc*100; out.push(['safe', `এই মাসে আয়ের <b>${Math.round(sr)}%</b> সঞ্চয় করেছেন${sr<20?' — ২০% লক্ষ্য রাখার চেষ্টা করুন':''}`, '#2a7fb8']); }
  const bySub = {}; txOf(m).forEach(t => { if(t.c==='exp'||t.c==='bill') bySub[t.s] = (bySub[t.s]||0) + t.a; });
  const top = Object.entries(bySub).sort((x,y)=>y[1]-x[1])[0];
  if(top && sp > 0) out.push(['tag', `সবচেয়ে বেশি খরচ: <b>${esc(top[0])}</b> — ${mv(top[1])} (${Math.round(top[1]/sp*100)}%)`, '#e0842b']);
  const b = S.budget[m] || {}, overs = [];
  ['bill','exp'].forEach(c => Object.entries(b[c]||{}).forEach(([s,v]) => { const ac = txOf(m).filter(t=>t.c===c&&t.s===s).reduce((x,t)=>x+t.a,0); if(v>0 && ac>v) overs.push(s); }));
  if(overs.length) out.push(['alert', `${overs.length}টি খাতে বাজেট ছাড়িয়েছে: <b>${overs.slice(0,3).map(esc).join(', ')}</b>${overs.length>3?' ...':''}`, '#c98a00']);
  if(m === tm && sp > 0){ const d = new Date().getDate(), proj = sp/d*dim(m); out.push(['clock', `এভাবে চললে মাস শেষে বিল+খরচ হবে প্রায় <b>${mv(Math.round(proj))}</b>${p.bill+p.exp>0 ? (proj > p.bill+p.exp ? ' — <span class="neg">বাজেটের বেশি</span>' : ' — <span class="pos">বাজেটের মধ্যে</span>') : ''}`, '#8457c4']); }
  return out;
}

  <circle cx="38" cy="38" r="${R}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" transform="rotate(-90 38 38)"/>
  <text x="38" y="43" text-anchor="middle" font-size="14" font-weight="700" fill="var(--tx)">${Math.round(pct*100)}%</text></svg>`;
}

/* ================= চার্ট ================= */
function prep(cv){
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = +cv.dataset.h;
  cv.style.height = h+'px'; cv.width = w*dpr; cv.height = h*dpr;
  const x = cv.getContext('2d'); x.scale(dpr,dpr); x.font = '10px system-ui'; return [x,w,h];
}
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); for(const m of [1,2,2.5,5,10]) if(m*p >= v) return m*p; return 10*p; }
function grid(x, w, h, pl, pt, pb, pr, max, min){
  min = min || 0; const mu = cssv('--mu'), bd = cssv('--bd');
  for(let i=0;i<=4;i++){ const v = min + (max-min)*i/4, y = pt+(h-pt-pb)*(1-i/4);
    x.strokeStyle = bd; x.lineWidth = 1; x.beginPath(); x.moveTo(pl,y); x.lineTo(w-pr,y); x.stroke();
    x.fillStyle = mu; x.textAlign = 'right'; x.font = '10px system-ui'; x.fillText(L.hide ? '•••' : short(v), pl-6, y+3); }
}
function rbar(x, X, Y, W, H, col){ if(H<=0.5) return; x.fillStyle = col; x.beginPath(); if(x.roundRect) x.roundRect(X, Y, W, H, [4,4,0,0]); else x.rect(X, Y, W, H); x.fill(); }
function drawCharts(){
  const tx = cssv('--tx'), mu = cssv('--mu');
  const cb = $('#cBar');
  if(cb && cb.clientWidth > 40){
    const a = actual(M), p = planned(M), A = CK.map(c=>p[c]), B = CK.map(c=>a[c]);
    const [x,w,h] = prep(cb), pl = 40, pb = 24, pt = 12, pr = 6, max = niceMax(Math.max(1,...A,...B));
    grid(x,w,h,pl,pt,pb,pr,max);
    const gw = (w-pl-pr)/CK.length, bw = Math.min(18, gw*.3), ih = h-pt-pb;
    CK.forEach((c,i) => { const cx = pl+gw*i+gw/2;
      rbar(x, cx-bw-1.5, h-pb-ih*A[i]/max, bw, ih*A[i]/max, cssv('--plan'));
      rbar(x, cx+1.5, h-pb-ih*B[i]/max, bw, ih*B[i]/max, cssv('--actl'));
      x.fillStyle = tx; x.textAlign = 'center'; x.font = '11px system-ui'; x.fillText(CATS[c].bn.split(' ')[0], cx, h-7); });
  }
  const cd = $('#cDonut');
  if(cd && cd.clientWidth > 40){

    if(!tot){ x.strokeStyle = cssv('--sf3'); x.lineWidth = R-r; x.beginPath(); x.arc(cx,cy,(R+r)/2,0,Math.PI*2); x.stroke();
      x.fillStyle = mu; x.textAlign = 'center'; x.font = '13px system-ui'; x.fillText('এখনো খরচ নেই', cx, cy+4); $('#dLeg').innerHTML = ''; }
    else {
      let a0 = -Math.PI/2; const gap = it.length > 1 ? 0.012 : 0;
      it.forEach(o => { const da = o.v/tot*Math.PI*2; x.beginPath(); x.arc(cx,cy,R,a0+gap,a0+da-gap); x.arc(cx,cy,r,a0+da-gap,a0+gap,true); x.closePath(); x.fillStyle = o.col; x.fill(); a0 += da; });
      x.fillStyle = tx; x.textAlign = 'center'; x.font = '700 15px system-ui'; x.fillText(L.hide ? '৳ ••••' : fmt(tot), cx, cy+3);
      x.fillStyle = mu; x.font = '11px system-ui'; x.fillText('মোট বিল + খরচ', cx, cy+19);
      $('#dLeg').innerHTML = it.map(o => `<div ${o.c?`class="hl" data-head="${o.c}" data-hs="${esc(o.l)}"`:''}><span><i style="background:${o.col}"></i><span class="hn">${esc(o.l)}</span></span><span>${mv(o.v)} · ${Math.round(o.v/tot*100)}%</span></div>`).join('');
    }
  }
  const cdy = $('#cDaily');
  if(cdy && cdy.clientWidth > 40){
    const n = dim(M), vals = Array(n).fill(0);
    txOf(M).forEach(t => { if(t.c==='bill'||t.c==='exp') vals[+t.d.slice(8)-1] += t.a; });
    const [x,w,h] = prep(cdy), pl = 36, pb = 20, pt = 10, pr = 4, max = niceMax(Math.max(1,...vals)), ih = h-pt-pb;
    grid(x,w,h,pl,pt,pb,pr,max);
    const gw = (w-pl-pr)/n, bw = Math.max(2, gw*.68);
    vals.forEach((v,i) => { rbar(x, pl+gw*i+(gw-bw)/2, h-pb-ih*v/max, bw, ih*v/max, cssv('--actl'));
      if((i+1)%5===0 || i===0){ x.fillStyle = mu; x.textAlign = 'center'; x.font = '10px system-ui'; x.fillText(String(i+1), pl+gw*i+gw/2, h-6); } });
    const tm = ymOf(today()), days = M===tm ? new Date().getDate() : M<tm ? n : 0;
    if(days){ const avg = vals.reduce((a,b)=>a+b,0)/days, y = h-pb-ih*avg/max;
      x.strokeStyle = cssv('--ac'); x.lineWidth = 2; x.setLineDash([5,4]); x.beginPath(); x.moveTo(pl,y); x.lineTo(w-pr,y); x.stroke(); x.setLineDash([]); }
  }
  const ctr = $('#cTrend');
  if(ctr && ctr.clientWidth > 40){
    const ms = []; for(let k=11;k>=0;k--) ms.push(addM(M,-k));
    const AA = ms.map(m=>actual(m)), I = AA.map(a=>a.inc), O = AA.map(a=>a.out), N = AA.map(a=>a.net);
    const [x,w,h] = prep(ctr), pl = 40, pb = 22, pt = 12, pr = 6;
    const max = niceMax(Math.max(1,...I,...O)), mn = Math.min(0,...N), min = mn<0 ? -niceMax(-mn) : 0;
    grid(x,w,h,pl,pt,pb,pr,max,min);
    const Y = v => pt+(h-pt-pb)*(1-(v-min)/(max-min)), gw = (w-pl-pr)/12, bw = Math.max(3, gw*.3), y0 = Y(0);
    ms.forEach((m,i) => { const cx = pl+gw*i+gw/2;
      rbar(x, cx-bw-.5, Y(I[i]), bw, y0-Y(I[i]), '#15965a'); rbar(x, cx+.5, Y(O[i]), bw, y0-Y(O[i]), cssv('--actl'));
      x.fillStyle = m===M ? tx : mu; x.textAlign = 'center'; x.font = (m===M?'700 ':'')+'9.5px system-ui'; x.fillText(MS[+m.slice(5)-1], cx, h-6); });
    x.strokeStyle = cssv('--ac'); x.lineWidth = 2.2; x.beginPath();
    N.forEach((v,i) => { const px = pl+gw*i+gw/2; if(i) x.lineTo(px, Y(v)); else x.moveTo(px, Y(v)); }); x.stroke();
    N.forEach((v,i) => { x.fillStyle = cssv('--ac'); x.beginPath(); x.arc(pl+gw*i+gw/2, Y(v), 3, 0, Math.PI*2); x.fill(); });
  }
}

    if(v > 0) S.budget[M][c][s] = r2(v); else delete S.budget[M][c][s];

    if(D.c){ c = D.c; if(c!=='trf' && !subList(c).includes(s)) s = ''; if(c==='trf' && (!to || to===acc)) to = other(acc); sq = '';
      sh.querySelectorAll('#fC button').forEach(x => x.classList.toggle('on', x===b)); drawBody(); }
    else if(D.acc){ acc = D.acc; drawBody(); }
    else if(D.from){ acc = D.from; if(to===acc) to = other(acc); drawBody(); }
    else if(D.to){ to = D.to; drawBody(); }
    else if(D.new){ const box = sh.querySelector('#fS'); b.outerHTML = `<span style="display:flex;gap:6px;width:100%"><input class="fi sm" id="fNewS" style="margin:0;flex:1" placeholder="${c==='lin'?'ঋণের নাম / কার কাছ থেকে':'নতুন খাতের নাম'}" autocomplete="off"><button type="button" class="mini ac" data-newok="1">যোগ</button></span>`;
      const ni = box.querySelector('#fNewS'); ni.focus(); ni.addEventListener('keydown', ev2 => { if(ev2.key==='Enter'){ ev2.preventDefault(); box.querySelector('[data-newok]').click(); } }); }
    else if(D.newok){ const n = (sh.querySelector('#fNewS').value||'').trim(); if(!n){ toast('নাম লিখুন'); return; } ensureSub(c,n); saveLocal(); s = n; sq = ''; drawBody(); }
    else if(D.s !== undefined){ s = D.s; drawSubs(); }
  });
  const doSave = more => {
    const a = evalAmt(aIn.value), d = sh.querySelector('#fD').value;
    if(!(a > 0)){ toast('সঠিক টাকার পরিমাণ লিখুন'); aIn.focus(); return; }
    if(c!=='trf' && !s){ toast('একটা খাত বেছে নিন'); return; }
    if(c==='trf' && (!to || to===acc)){ toast('কোথায় ট্রান্সফার হবে বাছুন'); return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ toast('তারিখ ঠিক করুন'); return; }
    const rec = {id: t ? t.id : uid(), d, a:r2(a), c, s: c==='trf' ? 'ট্রান্সফার' : s, n: sh.querySelector('#fN').value.trim(), acc, u:now()};
    if(c==='trf') rec.to = to;
    if(t && t.rid) rec.rid = t.rid;
    if(t) S.txns[S.txns.findIndex(x=>x.id===t.id)] = rec; else S.txns.push(rec);
    if(c==='lin' && !S.loans.some(l => l.name===s)){ S.loans.push({id:uid(), name:s, principal:0, apr:0, pay:0, start:ymOf(d), u:now()}); setTimeout(() => toast('ঋণ ট্যাবে কিস্তি ও সুদ সেট করে নিন'), 1600); }
    if(c!=='trf'){ L.lastAcc = acc; saveL(); }
    save(); buzz(); M = ymOf(d); toast('সেভ হয়েছে'); render();
    if(more){ txForm(null, c); const nf = $('#ov .sheet'); nf.querySelector('#fD').value = d; } else closeSheet(true);
  };
  sh.querySelector('#fSave').onclick = () => doSave(false);
  const mb = sh.querySelector('#fMore'); if(mb) mb.onclick = () => doSave(true);
  const db = sh.querySelector('#fDel'); if(db) db.onclick = () => { if(!confirm('এই লেনদেনটি মুছে ফেলবেন?')) return; delRec('txns', t.id); save(); closeSheet(true); render(); toast('মুছে ফেলা হয়েছে'); };
  if(!t) setTimeout(() => aIn.focus(), 250);
}

/* ব্যালেন্স মিলানো — আয়/খরচ নয়, আলাদা সমন্বয় (adj) */
function accFix(id){
  const ac = accById(id), cur = accBal(id, null);
  askSheet(`${hb('scale', CATS.adj.col)}${esc(ac.name)} মিলিয়ে নিন`, `এখন আসলে কত টাকা আছে? (অ্যাপে দেখাচ্ছে: ${fmt(cur)})`, '', v => {
    if(!v) return; const real = evalAmt(v); if(isNaN(real)){ toast('সঠিক অঙ্ক লিখুন'); return; }
    const diff = r2(real - cur); if(!diff){ toast('আগে থেকেই মিলে আছে'); return; }
    S.txns.push({id:uid(), d:today(), a:Math.abs(diff), c:'adj', neg:diff<0, s:'হিসাব সমন্বয়', n:'ব্যালেন্স মিলানো', acc:id, u:now()});
    save(); toast(`${fmt(Math.abs(diff))} ${diff>0?'যোগ':'বাদ'} করে মিলানো হয়েছে`);
  }, 'যেমন: 5000', true);
}

function scheduleSync(){ if(!L.sync.url || !L.sync.key || !L.sync.auto) return; clearTimeout(syncT); syncT = setTimeout(() => sync(false), 2500); }
async function post(body){
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 30000);
  try{
    const r = await fetch(L.sync.url, {method:'POST', body:JSON.stringify(Object.assign({secret:L.sync.key}, body)), headers:{'Content-Type':'text/plain;charset=utf-8'}, redirect:'follow', signal:ctl.signal});
    const txt = await r.text(); let j;
    try{ j = JSON.parse(txt); }catch(e){ throw new Error('সার্ভার থেকে সঠিক উত্তর আসেনি — Deploy করার সময় "Who has access: Anyone" দিয়েছেন কিনা দেখুন'); }
    if(!j.ok) throw new Error(j.err==='auth' ? 'Secret Key মিলেনি — Apps Script কোডের SECRET আর এখানের Key একই হতে হবে' : (j.err || 'অজানা সমস্যা'));
    return j;
  } catch(e){
    if(e.name==='AbortError') throw new Error('সার্ভার সাড়া দিচ্ছে না (টাইমআউট)');
    if(e instanceof TypeError) throw new Error(navigator.onLine ? 'সংযোগ হয়নি — URL ঠিক আছে কিনা দেখুন' : 'ইন্টারনেট নেই');
    throw e;
  } finally{ clearTimeout(tm); }
}
async function sync(manual, chained){
  if(!L.sync.url || !L.sync.key){ if(manual) toast('আগে ক্লাউড সিঙ্ক সেটআপ করুন'); return; }
  if(syncing){ syncAgain = true; return; }
  syncChain = chained ? syncChain + 1 : 0;
  syncing = true; setSync('busy');
  try{
    const before = JSON.stringify(S);
    const res = await post({action:'sync', data:S});
    const server = normalize(res.data || {});
    S = normalize(mergeData(S, server));   // রিকোয়েস্ট চলাকালীন লোকাল পরিবর্তনও রক্ষা পায়
    saveLocal(); L.sync.last = now(); saveL();
    setSync('ok'); if(manual) toast('সিঙ্ক সম্পন্ন');
    if(JSON.stringify(S) !== before){
      const ae = document.activeElement;
      if($('#ov') || (ae && ae.id==='txQ')) pendingRender = true; else render();
    }
    // সার্ভারে যা নেই এমন লোকাল পরিবর্তন থাকলে আবার পাঠাও (সর্বোচ্চ ২ বার)
    if(JSON.stringify(normalize(mergeData(server, S))) !== JSON.stringify(server) && syncChain < 2) syncAgain = true;
  }catch(e){ setSync(navigator.onLine ? 'err' : 'off', e.message); if(manual) toast(e.message); }
  finally{ syncing = false; if(syncAgain){ syncAgain = false; setTimeout(() => sync(false, true), 800); } }
}

function ensureKey(){
  if(!L.sync.key){ const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let k = 'hishab-'; const r = crypto.getRandomValues(new Uint8Array(10)); r.forEach(x => k += a[x % a.length]); L.sync.key = k; saveL(); }

function gasCode(){
  return `/***** আমার হিসাব — ক্লাউড সিঙ্ক সার্ভার (Google Apps Script) *****
 * সেটআপ: Deploy > New deployment > Web app > Execute as: Me > Who has access: Anyone
 * নিচের SECRET অ্যাপের Secret Key এর সাথে হুবহু মিলতে হবে।
 */
const SECRET = ${JSON.stringify(L.sync.key || 'এখানে-আপনার-গোপন-কী-লিখুন')};
const FILE_NAME = 'AMAR_HISHAB_DATA.json';
const BK_FOLDER = 'AmarHishab_Backups';
const KEEP_BK = 30;

function doGet(){ return out_({ok:true, app:'Amar Hishab', msg:'সার্ভার চালু আছে'}); }

function doPost(e){
  let req;
  try{ req = JSON.parse(e.postData.contents); }catch(err){ return out_({ok:false, err:'bad json'}); }
  if(req.secret !== SECRET) return out_({ok:false, err:'auth'});
  const lock = LockService.getScriptLock(); lock.waitLock(25000);
  try{
    const f = file_(); let cur = {};
    try{ cur = JSON.parse(f.getBlob().getDataAsString() || '{}'); }catch(err){ cur = {}; }
    if(req.action === 'ping') return out_({ok:true, count:(cur.txns||[]).length, time:Date.now()});
    if(req.action === 'pull') return out_({ok:true, data:cur});
    if(req.action === 'sync'){
      const m = mergeData(cur, req.data || {});
      f.setContent(JSON.stringify(m)); backup_(f, false);
      return out_({ok:true, data:m});
    }
    if(req.action === 'replace'){ backup_(f, true); f.setContent(JSON.stringify(req.data || {})); return out_({ok:true}); }
    return out_({ok:false, err:'unknown action'});
  } finally { lock.releaseLock(); }
}
function file_(){
  const p = PropertiesService.getScriptProperties(), id = p.getProperty('FILE_ID');
  if(id){ try{ return DriveApp.getFileById(id); }catch(e){} }
  const f = DriveApp.createFile(FILE_NAME, '{}', MimeType.PLAIN_TEXT);
  p.setProperty('FILE_ID', f.getId()); return f;
}
function backup_(f, force){
  const p = PropertiesService.getScriptProperties(), d = Utilities.formatDate(new Date(), 'Asia/Dhaka', 'yyyy-MM-dd');
  if(!force && p.getProperty('LAST_BK') === d) return;
  p.setProperty('LAST_BK', d);
  const it = DriveApp.getFoldersByName(BK_FOLDER), fo = it.hasNext() ? it.next() : DriveApp.createFolder(BK_FOLDER);
  f.makeCopy('AmarHishab_' + Utilities.formatDate(new Date(), 'Asia/Dhaka', 'yyyy-MM-dd_HHmm') + '.json', fo);
  const all = [], fi = fo.getFiles(); while(fi.hasNext()) all.push(fi.next());
  all.sort(function(a,b){ return b.getDateCreated() - a.getDateCreated(); }).slice(KEEP_BK).forEach(function(x){ x.setTrashed(true); });
}
function out_(o){ return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }

function copyText(t, msg, onFail){
  const ok = () => toast(msg || 'কপি হয়েছে');
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let done = false; try{ done = document.execCommand('copy'); }catch(e){} ta.remove(); if(done) ok(); else if(onFail) onFail(); else toast('কপি হয়নি'); };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, fallback); else fallback();
}

    A(12,900,'exp','রেস্টুরেন্ট','bkash'); A(14,1800,'exp','বাজার-সদাই','cash','আলু, পেঁয়াজ, সবজি'); A(20,1200,'exp','মাছ-মাংস','cash'); A(22,700,'exp','ওষুধ-ডাক্তার','cash');
    A(5,2500,'sav','DPS','bank'); A(5,2000,'debt','পার্সোনাল লোন','bank'); if(k<=2) A(6,3000,'debt','ফ্রিজ কিস্তি','bkash');
    S.budget[m] = {inc:{'বেতন':40000,'কমিশন':15000}, sav:{'DPS':2500}, bill:{'বাসা ভাড়া':12000,'মোবাইল বিল':700,'ইন্টারনেট':1200,'বিদ্যুৎ বিল':1500},
      exp:{'বাজার-সদাই':2000,'চাল':2500,'মাছ-মাংস':2500,'যাতায়াত':1500,'স্কুল ফি':2000,'রেস্টুরেন্ট':800}, debt:{'পার্সোনাল লোন':2000,'ফ্রিজ কিস্তি':3000}, u:t0}; }
  if(!S.goals.some(g=>g.name==='DPS')) S.goals.push({id:uid(), name:'DPS', target:300000, start:60000, monthly:2500, u:t0});
  ensureSub('sav','বাড়ি'); if(!S.goals.some(g=>g.name==='বাড়ি')) S.goals.push({id:uid(), name:'বাড়ি', target:1000000, start:220000, monthly:5000, u:t0});
  if(!S.loans.some(l=>l.name==='পার্সোনাল লোন')) S.loans.push({id:uid(), name:'পার্সোনাল লোন', principal:70000, apr:9, pay:2000, start:addM(tm,-5), u:t0});
  if(!S.loans.some(l=>l.name==='ফ্রিজ কিস্তি')) S.loans.push({id:uid(), name:'ফ্রিজ কিস্তি', principal:36000, apr:0, pay:3000, start:addM(tm,-2), u:t0});
  if(!S.recs.length) S.recs.push({id:uid(), c:'inc', s:'বেতন', a:40000, day:1, acc:'bank', u:t0}, {id:uid(), c:'bill', s:'বাসা ভাড়া', a:12000, day:3, acc:'cash', u:t0}, {id:uid(), c:'bill', s:'গ্যাস বিল', a:1080, day:15, acc:'bkash', u:t0});
  S.subsU = t0; save(); M = tm; go('dash'); toast('ডেমো ডেটা যোগ হয়েছে');
}

/* ================= ইভেন্ট ================= */
document.querySelectorAll('[data-ic]').forEach(el => { el.innerHTML = ic(el.dataset.ic); });
$('#icSync').innerHTML = ic('cloud'); $('#icSet').innerHTML = ic('sliders');
$('#mPrev').innerHTML = ic('left'); $('#mNext').innerHTML = ic('right');
$('#mPrev').onclick = () => { M = addM(M,-1); render(); };
$('#mNext').onclick = () => { M = addM(M,1); render(); };
$('#fab').onclick = () => txForm();
$('#btnSet').onclick = () => go('set');
$('#btnSync').onclick = () => go('sync');
$('#nav').onclick = e => { const b = e.target.closest('.nb'); if(!b) return; if(b.dataset.tab==='more') menuSheet(); else go(b.dataset.tab); };
$('#view').addEventListener('click', e => {
  const t = e.target.closest('[data-tx],[data-go],[data-act],[data-goal],[data-loan],[data-addsub],[data-f],[data-fa],[data-new],[data-recadd],[data-recedit],[data-accedit],[data-accfix],[data-theme],[data-sc],[data-ren],[data-dsub],[data-lin],[data-lpay],[data-head],[data-bud]');
  if(!t) return; const D = t.dataset;
  if(D.bud) budSheet(D.bud, D.bs);
  else if(D.head) headSheet(D.head, D.hs);
  else if(D.tx){ const x = S.txns.find(y=>y.id===D.tx); if(x) txForm(x); }
  else if(D.go) go(D.go);
  else if(D.new) txForm(null, D.new);
  else if(D.f){ fCat = D.f; document.querySelectorAll('#txF .chip').forEach(c=>c.classList.toggle('on', c===t)); drawTxList(); }
  else if(D.fa){ fAcc = D.fa; document.querySelectorAll('#txA .chip').forEach(c=>c.classList.toggle('on', c===t)); drawTxList(); }
  else if(D.goal) goalForm(S.goals.find(g=>g.id===D.goal));
  else if(D.loan) loanForm(S.loans.find(l=>l.id===D.loan));
  else if(D.accedit) accForm(accById(D.accedit));
  else if(D.accfix) accFix(D.accfix);
  else if(D.lin){ const l = S.loans.find(x=>x.id===D.lin); if(l) txForm(null, 'lin', l.name); }
  else if(D.lpay){ const l = S.loans.find(x=>x.id===D.lpay); if(l){ txForm(null, 'debt', l.name); if(l.pay) setTimeout(() => { const a = $('#fA'); if(a && !a.value) a.value = l.pay; }, 50); } }
  else if(D.recedit) recForm(S.recs.find(r=>r.id===D.recedit));
  else if(D.recadd){ const r = S.recs.find(x=>x.id===D.recadd); if(r && !recDone(r,M)){ addRecTx(r,M); save(); buzz(); render(); toast('যোগ হয়েছে'); } }
  else if(D.addsub){ const c = D.addsub; askSheet('নতুন খাত — ' + CATS[c].bn, 'খাতের নাম', '', n => { if(!n) return; if(S.subs[c].includes(n)){ toast('আগে থেকেই আছে'); return; } ensureSub(c,n); save(); }, 'যেমন: ফল-মূল'); }
  else if(D.theme){ L.theme = D.theme; saveL(); applyTheme(); render(); }
  else if(D.sc){ setCat = D.sc; render(); }
  else if(D.ren){ const o = S.subs[setCat][+D.ren]; askSheet('খাতের নাম বদলান', 'নতুন নাম', o, n => { if(!n || n===o) return; if(renameSub(setCat,o,n)) save(); }); }
  else if(D.dsub){ const Ls = S.subs[setCat], o = Ls[+D.dsub]; if(!confirm(`"${o}" খাতটি তালিকা থেকে সরাবেন? (পুরনো লেনদেন থাকবে)`)) return; Ls.splice(+D.dsub,1); S.subsU = now(); save(); render(); }
  else if(D.act) act(D.act);
});
function act(a){
  switch(a){
    case 'demo': if(S.txns.length && !confirm('বর্তমান ডেটার সাথে ডেমো ডেটা যোগ হবে। চালিয়ে যাবেন?')) return; loadDemo(); break;
    case 'hide': L.hide = !L.hide; saveL(); applyTheme(); render(); break;
    case 'goal': goalForm(); break;
    case 'loan': loanForm(); break;
    case 'acc': accForm(); break;
    case 'rec': recForm(); break;
    case 'recAll': { let n = 0; S.recs.forEach(r => { if(!recDone(r,M)){ addRecTx(r,M); n++; } }); save(); buzz(); render(); toast(`${n}টি যোগ হয়েছে`); break; }
    case 'copyBud': { const pv = S.budget[addM(M,-1)]; if(!pv || !Object.keys(pv).some(k=>k!=='u' && Object.keys(pv[k]||{}).length)){ toast('আগের মাসে কোনো বাজেট নেই'); return; }
      if(planned(M).inc + planned(M).out > 0 && !confirm('এই মাসের বাজেট বদলে আগের মাসেরটা বসাবেন?')) return;
      S.budget[M] = Object.assign(JSON.parse(JSON.stringify(pv)), {u:now()}); save(); render(); toast('কপি হয়েছে'); break; }
    case 'print': printReport(); break;
    case 'share': shareReport(); break;
    case 'csvM': exportCSV(txOf(M), `Hishab_${M}.csv`); break;
    case 'csvA': exportCSV(S.txns, `Hishab_All_${today()}.csv`); break;
    case 'backup': download(`Amar_Hishab_Backup_${today()}.json`, JSON.stringify(S), 'application/json'); break;
    case 'restore': restore(); break;
    case 'wipe': wipeAll(); break;
    case 'pin': pinSheet(); break;
    case 'sync': go('sync'); break;
    case 'guide': go('guide'); break;
    case 'syncNow': sync(true); break;
    case 'syncEdit': syncSheet(); break;
    case 'syncTest': testConn(); break;
    case 'name': askSheet('আপনার নাম', 'নাম (রিপোর্টে ও শুভেচ্ছায় দেখাবে)', L.name, v => { L.name = v; saveL(); toast('সেভ হয়েছে'); }, 'যেমন: ফরিদ'); break;
    case 'errClear': try{ localStorage.removeItem('amar_hishab_err'); }catch(e){} render(); break;
    case 'errCopy': copyText(errList().join('\n'), 'কপি হয়েছে — Claude-কে পাঠিয়ে দিন'); break;
    case 'copyGas': ensureKey(); copyText(gasCode(), 'কোড কপি হয়েছে — এবার script.google.com-এ পেস্ট করুন', viewGas); if(TAB==='sync') setTimeout(render, 50); break;
    case 'shareGas': { ensureKey(); const t = gasCode(); if(navigator.share) navigator.share({title:'আমার হিসাব — Apps Script কোড', text:t}).catch(()=>{}); else copyText(t, 'কোড কপি হয়েছে', viewGas); break; }
    case 'dlGas': ensureKey(); download('AmarHishab_AppsScript.gs.txt', gasCode(), 'text/plain;charset=utf-8'); break;
    case 'viewGas': ensureKey(); viewGas(); break;
    case 'pasteUrl': if(navigator.clipboard && navigator.clipboard.readText) navigator.clipboard.readText().then(t => { t = (t||'').trim(); if(!t){ toast('ক্লিপবোর্ড খালি'); return; } const u = $('#sU'); if(u) u.value = t; toast('পেস্ট হয়েছে — এবার "সেভ ও সংযোগ পরীক্ষা" চাপুন'); }, () => toast('পেস্ট করা গেল না — ঘরে চেপে ধরে Paste করুন')); else toast('ঘরে চেপে ধরে Paste করুন'); break;
    case 'install': if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } break;
    case 'forcePull': forcePull(); break;
    case 'forcePush': forcePush(); break;
  }
}
$('#view').addEventListener('input', e => { if(e.target.id==='txQ'){ fQ = e.target.value; drawTxList(); } });
$('#view').addEventListener('change', e => {
  const el = e.target;
  if(el.id==='stHide'){ L.hide = el.checked; saveL(); applyTheme(); }
  else if(el.id==='syA'){ L.sync.auto = el.checked; saveL(); toast(el.checked ? 'অটো সিঙ্ক চালু' : 'অটো সিঙ্ক বন্ধ'); }
});
$('#view').addEventListener('focusout', e => { if(pendingRender && e.target.id==='txQ') setTimeout(() => { if(pendingRender && !$('#ov')) render(); }, 300); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeSheet(); });
let rsT; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(drawCharts, 150); });
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ hiddenAt = now(); }
  else { if(L.pin && hiddenAt && now()-hiddenAt > 60000) lockScreen(); if(L.sync.auto) sync(false); }
});
window.addEventListener('online', () => { if(L.sync.auto) sync(false); });
setInterval(() => { if(!document.hidden && L.sync.auto && L.sync.url) sync(false); }, 60000);
if(window.matchMedia){ const mq = window.matchMedia('(prefers-color-scheme: dark)'); if(mq.addEventListener) mq.addEventListener('change', () => requestAnimationFrame(drawCharts)); }

/* ================= PWA ================= */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if(TAB==='set' && !$('#ov')) render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('অ্যাপ ইনস্টল হয়েছে!'); render(); });
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ================= শুরু ================= */
applyTheme();
if(S.txns.some(t => t.c==='adj' && t.u && now() - t.u < 5000)) saveLocal();   // পুরনো সমন্বয় রূপান্তর হলে সেভ
render();
setSync('idle');
lockScreen();
if(L.sync.url && L.sync.key && L.sync.auto) setTimeout(() => sync(false), 600);
</script>
</body>
