<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a3d2c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="আমার হিসাব">
<title>আমার হিসাব</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= থিম ================= */
:root{--bg:#f2f5f3;--card:#fff;--card2:#f7faf8;--tx:#14201a;--mu:#6b7b73;--bd:#e3eae6;--g1:#07301f;--g2:#0b4a32;--g3:#15804f;--gold:#f5b301;--gold1:#ffd66b;--gold2:#fff3cf;--soft:#e7f3ec;--red:#d64545;--pos:#138a4b;--lk:#0f7a45;--plan:#9fcbe0;--act:#f2b27c;--sh:0 6px 22px rgba(8,50,33,.07);--sh2:0 12px 32px rgba(8,50,33,.18);color-scheme:light}
:root[data-theme="dark"]{--bg:#0a0f0d;--card:#131b17;--card2:#18221d;--tx:#e6eee9;--mu:#8ea198;--bd:#24312a;--soft:#143324;--gold2:#3a3014;--pos:#3ccf7f;--red:#ff6b6b;--lk:#5fd394;--plan:#4c89a8;--act:#d4874f;--sh:0 6px 22px rgba(0,0,0,.35);--sh2:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f0d;--card:#131b17;--card2:#18221d;--tx:#e6eee9;--mu:#8ea198;--bd:#24312a;--soft:#143324;--gold2:#3a3014;--pos:#3ccf7f;--red:#ff6b6b;--lk:#5fd394;--plan:#4c89a8;--act:#d4874f;--sh:0 6px 22px rgba(0,0,0,.35);--sh2:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri",system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card)}
.hideamt .mv{filter:blur(7px);user-select:none}
/* ================= হেডার ================= */
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--g1),var(--g2) 60%,#0e5a3c);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:640px;margin:0 auto}
.htl small{display:block;font-size:12px;opacity:.75;line-height:1.2}
.htl h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px;line-height:1.3}
.htl h1 span{color:var(--gold)}
.hbtns{display:flex;gap:8px}
.ibtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12);border-radius:12px;min-width:38px;height:38px;font-size:16px;color:#fff;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 9px}
.sdot{width:8px;height:8px;border-radius:50%;background:#9aa;display:inline-block;flex:none}
.sdot.ok{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}.sdot.busy{background:var(--gold);animation:pulse 1s infinite}.sdot.err{background:#ff6b6b}.sdot.off{background:#9aa}
@keyframes pulse{50%{opacity:.35}}
.mbar{display:flex;align-items:center;justify-content:space-between;margin:10px auto 0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:3px;max-width:640px}
.mbar button{background:none;border:0;color:#fff;font-size:22px;width:46px;height:34px;border-radius:10px}
.mbar button:active{background:rgba(255,255,255,.15)}
.mbar b{font-size:15px;font-weight:600}
main{padding:14px 14px calc(104px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
main>*{animation:rise .28s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
/* ================= কার্ড ================= */
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:15px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.card h3 small{margin-left:auto;font-weight:500;color:var(--mu);font-size:12px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.ch span:first-child{font-weight:700}
.ch small{color:var(--mu)}
.hero{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--g1) 0%,var(--g2) 45%,var(--g3) 100%);color:#fff;border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--sh2)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero:before{width:220px;height:220px;right:-70px;top:-90px;background:radial-gradient(circle,rgba(245,179,1,.35),transparent 65%)}
.hero:after{width:180px;height:180px;left:-60px;bottom:-100px;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 65%)}
.hr1{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.9;position:relative}
.eye{background:rgba(255,255,255,.14);border:0;border-radius:10px;padding:4px 9px;color:#fff;font-size:13px}
.hbig{font-size:34px;font-weight:700;margin:4px 0 12px;letter-spacing:.3px;position:relative}
.hbig.neg{color:#ffc9c4}
.hpills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative}
.pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 10px;backdrop-filter:blur(6px);min-width:0}
.pill small{display:block;font-size:11px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill b{font-size:14px;font-weight:600;white-space:nowrap}
.accs{display:flex;gap:10px;overflow-x:auto;margin:0 -14px 14px;padding:2px 14px 6px;scrollbar-width:none}
.accs::-webkit-scrollbar{display:none}
.accc{flex:none;min-width:132px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 12px;box-shadow:var(--sh);text-align:left}
.accc .ai{font-size:20px}
.accc small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.accc b{font-size:15px}
.accc.add{display:flex;align-items:center;justify-content:center;min-width:100px;color:var(--lk);font-weight:600;border-style:dashed;box-shadow:none}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.qa button{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;box-shadow:var(--sh)}
.qa i{font-style:normal;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px}
.qa button:active{transform:scale(.95)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:var(--sh);min-width:0}
.tile .tn{font-size:12px;color:var(--mu);display:flex;gap:6px;align-items:center}
.tile .tv{font-size:17px;font-weight:700;margin:3px 0 1px}
.tile .tp{font-size:11px;color:var(--mu)}
.bar{height:7px;background:var(--bd);border-radius:7px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:7px;transition:width .5s}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mu);margin-top:6px;flex-wrap:wrap}
.legend i,.dleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
canvas{width:100%;display:block}
.dleg{display:grid;gap:6px;margin-top:10px;font-size:13px}
.dleg div{display:flex;justify-content:space-between;gap:8px}
.dleg span:last-child{color:var(--mu);white-space:nowrap}
.ins{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:14px}
.ins:last-child{border-bottom:0}
.ins i{font-style:normal;font-size:18px;line-height:1.2}
.welcome{background:linear-gradient(135deg,var(--gold2),var(--card))}
.pend{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.pend:last-of-type{border-bottom:0}
.pend .tm{flex:1}
.mini{border:0;border-radius:10px;padding:6px 12px;font-size:12px;font-weight:700;background:var(--soft);color:var(--lk);white-space:nowrap}
/* ================= লেনদেন ================= */
.tx{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--bd);cursor:pointer}
.tx:last-child{border-bottom:0}
.ti{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:18px;flex:none}
.tm{flex:1;min-width:0}
.tm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm small{color:var(--mu);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta{font-weight:700;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--red)}.muted{color:var(--mu)}
.dh{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);font-weight:600;margin:14px 2px 0}
.search{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;background:var(--card);box-shadow:var(--sh)}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:7px 13px;white-space:nowrap;font-size:13px}
.chip.on{background:var(--g2);color:#fff;border-color:var(--g2)}
.chip.add{border-style:dashed;color:var(--lk)}
.sumline{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;font-size:13px;background:var(--soft);border-radius:14px;padding:10px 12px;margin:4px 0 10px;align-items:center}
.empty{text-align:center;color:var(--mu);padding:24px 10px;font-size:14px}
.link{background:none;border:0;color:var(--lk);font-weight:600;padding:8px 0 0}
/* ================= বাজেট ================= */
.brow{display:grid;grid-template-columns:1fr 96px 88px;gap:8px;align-items:center;padding:8px 0 6px;border-bottom:1px dashed var(--bd)}
.brow .bn{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow input{width:100%;padding:8px;border:1px solid var(--bd);border-radius:10px;text-align:right;background:var(--card2)}
.brow .ba{text-align:right;font-size:13px;font-weight:600}
.brow .bar{grid-column:1/-1;margin-top:0;height:5px}
.bhead{display:grid;grid-template-columns:1fr 96px 88px;gap:8px;font-size:11px;color:var(--mu);text-align:right}
.bhead span:first-child{text-align:left}
.over{color:var(--red)}
/* ================= রিপোর্ট ================= */
.stmt{width:100%;border-collapse:collapse;font-size:14px}
.stmt td{padding:8px 2px;border-bottom:1px solid var(--bd)}
.stmt td:last-child{text-align:right;font-weight:600;white-space:nowrap}
.stmt tr.tot td{border-top:2px solid var(--tx);border-bottom:0;font-weight:700;font-size:15px}
.stmt tr.sub td{color:var(--mu);font-size:13px}
table.grid{width:100%;border-collapse:collapse;font-size:12.5px}
.grid th,.grid td{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:right}
.grid th:first-child,.grid td:first-child{text-align:left}
.grid th{color:var(--mu);font-weight:600;font-size:11.5px}
.grid tr.cat td{font-weight:700;background:var(--card2)}
.grid tr.now td{background:var(--gold2)}
.rbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.rbtns button{border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:11px 4px;font-weight:600;font-size:13px;box-shadow:var(--sh)}
.rbtns button.pri{background:linear-gradient(135deg,var(--g2),var(--g3));color:#fff;border:0}
/* ================= লক্ষ্য/ঋণ ================= */
.goal{display:flex;gap:14px;align-items:center}
.ring{flex:none}
.gd{flex:1;min-width:0}
.gd b{font-size:16px}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13px;margin-top:6px}
.kv span:nth-child(odd){color:var(--mu)}
.kv span:nth-child(even){text-align:right;font-weight:600}
.edit{background:var(--soft);border:0;border-radius:10px;padding:6px 11px;font-size:12px;color:var(--lk);font-weight:700}
details summary{cursor:pointer;color:var(--lk);font-weight:600;font-size:13px;margin-top:10px}
.warn{background:var(--gold2);border-radius:12px;padding:9px 11px;font-size:12.5px;margin-top:8px}
.addbig{width:100%;padding:14px;border:1.5px dashed var(--lk);border-radius:16px;background:none;color:var(--lk);font-weight:700;margin-bottom:14px}
/* ================= নেভিগেশন ================= */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--bd);display:flex;align-items:flex-end;padding:4px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.06)}
nav button{flex:1;background:none;border:0;padding:6px 0 2px;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:1px}
nav button i{font-style:normal;font-size:20px;filter:grayscale(.6);opacity:.8}
nav button.on{color:var(--lk);font-weight:700}
nav button.on i{filter:none;opacity:1}
nav .fabw{flex:1;display:flex;justify-content:center}
.fab{width:60px;height:60px;margin-top:-26px;border-radius:20px;border:4px solid var(--bg);background:linear-gradient(135deg,var(--gold1),var(--gold));color:#3a2800;font-size:32px;font-weight:700;box-shadow:0 8px 20px rgba(245,179,1,.45);line-height:1;transition:transform .15s}
.fab:active{transform:scale(.92)}
/* ================= শিট ================= */
.ov{position:fixed;inset:0;background:rgba(5,15,10,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s;backdrop-filter:blur(2px)}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:su .22s ease-out}
.grab{width:42px;height:5px;background:var(--bd);border-radius:5px;margin:4px auto 10px}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.shead h2{font-size:17px;margin:0}
.x{border:0;background:var(--card2);border-radius:10px;width:34px;height:34px}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(40px);opacity:.5}}
.amt{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--g3);margin:4px 0 4px}
.amt span{font-size:26px;color:var(--mu)}
.amt input{border:0;outline:0;font-size:34px;font-weight:700;width:100%;padding:4px 0;background:none}
.amthint{font-size:12px;color:var(--mu);min-height:18px;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.seg button{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:9px 4px;font-size:13px}
.seg button.on{background:var(--cc);color:#fff;border-color:var(--cc);font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fl{display:block;font-size:12px;color:var(--mu);margin:0 0 5px;font-weight:500}
.fi{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:12px;background:var(--card2)}
.fi.sm{padding:8px 11px;margin-bottom:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;padding:13px;border-radius:14px;border:1px solid var(--bd);background:var(--card);font-weight:700}
.btn.pri{background:linear-gradient(135deg,var(--g2),var(--g3));color:#fff;border:0}
.btn.gold{background:linear-gradient(135deg,var(--gold1),var(--gold));color:#3a2800;border:0}
.btn.del{color:var(--red);border-color:var(--red);flex:.6}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);gap:8px}
.setrow button:not(.mini){border:0;background:none;font-size:16px;padding:4px 6px}
.sbtn{width:100%;text-align:left;padding:13px;border:1px solid var(--bd);border-radius:14px;background:var(--card);margin-bottom:8px;font-weight:600}
.sbtn.red{color:var(--red)}
.note{font-size:12.5px;color:var(--mu);line-height:1.6}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu button{border:1px solid var(--bd);background:var(--card2);border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600}
.menu i{font-style:normal;font-size:26px}
.sw{position:relative;width:48px;height:28px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--bd);border-radius:28px;transition:.2s}
.sw span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--g3)}
.sw input:checked+span:before{transform:translateX(20px)}
.segs{display:flex;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:3px}
.segs button{flex:1;border:0;background:none;border-radius:9px;padding:7px 4px;font-size:13px}
.segs button.on{background:var(--card);box-shadow:var(--sh);font-weight:700}
ol.steps{padding-left:20px;margin:6px 0;font-size:13.5px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#15201b;color:#fff;padding:10px 18px;border-radius:22px;z-index:300;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%)}
/* ================= লক স্ক্রিন ================= */
.lock{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,var(--g1),var(--g2) 55%,var(--g3));color:#fff;display:flex;align-items:center;justify-content:center;outline:0}
.lk{text-align:center;width:100%;max-width:320px;padding:20px}
.lklogo{width:74px;height:74px;margin:0 auto 10px;border-radius:24px;background:linear-gradient(135deg,var(--gold1),var(--gold));color:#3a2800;font-size:40px;font-weight:700;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.lk h2{margin:6px 0 2px}.lk p{margin:0 0 18px;opacity:.8}
.dots{display:flex;gap:16px;justify-content:center;margin-bottom:26px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}
.dots i.on{background:var(--gold);border-color:var(--gold)}
.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 18px}
.kp button{height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:24px;font-weight:600}
.kp button:disabled{visibility:hidden}
.kp button:active{background:rgba(255,255,255,.3)}
.lkf{background:none;border:0;color:#fff;opacity:.7;margin-top:18px;font-size:13px}
/* ================= প্রিন্ট ================= */
#printArea{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;color:#000;font-family:"Times New Roman","Hind Siliguri",serif;font-size:12pt}
  #printArea h1{font-size:18pt;margin:0;text-align:center}
  #printArea .prs{text-align:center;margin:2px 0 12px;font-size:11pt}
  #printArea h2{font-size:13pt;margin:14px 0 6px;border-bottom:1.5px solid #000;padding-bottom:2px}
  #printArea table{width:100%;border-collapse:collapse;font-size:10.5pt}
  #printArea th,#printArea td{border:1px solid #999;padding:4px 6px;text-align:right}

/* ================= ডেটা মডেল ================= */
function blank(){
  return {v:2, txns:[], goals:[], loans:[], recs:[],
    accs:[{id:'cash',name:'নগদ',ic:'💵',open:0,u:0},{id:'bkash',name:'বিকাশ',ic:'📱',open:0,u:0},{id:'bank',name:'ব্যাংক',ic:'🏛️',open:0,u:0}],
    budget:{}, subs:JSON.parse(JSON.stringify(DEF_SUBS)), subsU:0, del:{}};
}
function normalize(d){
  const o = Object.assign(blank(), d || {});
  ['txns','goals','loans','recs','accs'].forEach(k => { if(!Array.isArray(o[k])) o[k] = []; });
  if(!o.accs.length) o.accs = blank().accs;
  if(!o.subs || typeof o.subs !== 'object') o.subs = JSON.parse(JSON.stringify(DEF_SUBS));
  CK.forEach(c => { if(!Array.isArray(o.subs[c])) o.subs[c] = DEF_SUBS[c].slice(); });
  if(!o.budget || typeof o.budget !== 'object') o.budget = {};
  if(!o.del || typeof o.del !== 'object') o.del = {};
  o.v = 2; return o;
}
/* সিঙ্ক মার্জ — ক্লায়েন্ট ও Apps Script সার্ভার দুই জায়গাতেই হুবহু এই ফাংশন চলে।
   id ভিত্তিক — তাই কখনো ডুপ্লিকেট হয় না; নতুন u (updatedAt) জেতে; del = মুছে ফেলার রেকর্ড (tombstone) */
function mergeData(a, b){
  a = a || {}; b = b || {};
  var out = {v:2, budget:{}, del:{}};
  var del = {}, k;
  [a.del || {}, b.del || {}].forEach(function(d){ for(k in d){ if(!(k in del) || d[k] > del[k]) del[k] = d[k]; } });
  var cut = Date.now() - 180*864e5;
  for(k in del){ if(del[k] < cut) delete del[k]; }
  ['txns','goals','loans','accs','recs'].forEach(function(col){
    var m = {};
    (a[col] || []).concat(b[col] || []).forEach(function(r){
      if(!r || !r.id) return; var x = m[r.id];
      if(!x || (r.u || 0) > (x.u || 0)) m[r.id] = r;
    });
    out[col] = Object.keys(m).map(function(id){ return m[id]; }).filter(function(r){ return !(del[r.id] >= (r.u || 0)); });
  });
  var ba = a.budget || {}, bb = b.budget || {};
  Object.keys(ba).concat(Object.keys(bb)).forEach(function(ym){
    var x = ba[ym], y = bb[ym];
    out.budget[ym] = !x ? y : !y ? x : ((y.u || 0) > (x.u || 0) ? y : x);
  });
  if((b.subsU || 0) > (a.subsU || 0)){ out.subs = b.subs; out.subsU = b.subsU; }
  else { out.subs = a.subs || b.subs; out.subsU = a.subsU || 0; }
  out.del = del; return out;
}

/* ================= স্টোরেজ ================= */
function migrateV1(){

    o.loans = (d.loans||[]).map(l => Object.assign({}, l, {u:t0}));
    Object.keys(d.budget||{}).forEach(ym => { o.budget[ym] = Object.assign({}, d.budget[ym], {u:t0}); });
    if(d.subs) CK.forEach(c => { if(Array.isArray(d.subs[c])) o.subs[c] = d.subs[c]; });
    o.subsU = t0; return o;
  }catch(e){ return null; }
}
function load(){

/* ================= হেল্পার ================= */
const $ = s => document.querySelector(s);
const bnD = s => String(s).replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));
const num = v => { const n = parseFloat(bnD(v ?? '').replace(/[,৳\s]/g,'')); return isFinite(n) ? n : 0; };
function evalAmt(v){ // "250+120" এর মতো হিসাবও চলবে
  const x = bnD(v ?? '').replace(/[,৳\s]/g,'').replace(/×/g,'*').replace(/÷/g,'/');
  if(!x) return 0;
  if(/^-?[0-9.]+$/.test(x)) return parseFloat(x) || 0;
  if(!/^[0-9+\-*/.()]+$/.test(x)) return NaN;
  try{ const r = Function('"use strict";return (' + x + ')')(); return isFinite(r) ? r : NaN; }catch(e){ return NaN; }
}
const r2 = n => Math.round(n*100)/100;
const fmt = n => (n < -0.004 ? '−' : '') + '৳ ' + Math.abs(r2(n)).toLocaleString('en-IN', {maximumFractionDigits:2});
const mv = n => `<span class="mv">${fmt(n)}</span>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const now = () => Date.now();
const pad = n => String(n).padStart(2,'0');
const today = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const ymOf = d => d.slice(0,7);
function addM(ym, k){ let [y,m] = ym.split('-').map(Number); m += k; y += Math.floor((m-1)/12); m = ((m-1)%12+12)%12+1; return y+'-'+pad(m); }
const dim = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const mLabel = ym => { const [y,m] = ym.split('-'); return MN[m-1]+' '+y; };
const mName = ym => MN[+ym.slice(5)-1];

const dLabel = d => { const [y,m,dd] = d.split('-'); return dd+' '+MS[m-1]+' '+y.slice(2); };
const WD = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];

const short = v => { const s = v<0?'-':''; v = Math.abs(v); return s + (v>=1e7 ? r2(v/1e7)+'Cr' : v>=1e5 ? r2(v/1e5)+'L' : v>=1e3 ? r2(v/1e3)+'k' : String(Math.round(v))); };
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(()=>e.classList.remove('show'), 2200); }
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms||12); }catch(e){} };
function hashPin(p){ let h = 0x811c9dc5; const s = 'amarhishab:' + p; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16); }
function greet(){ const h = new Date().getHours(); return h<5?'শুভ রাত্রি':h<12?'শুভ সকাল':h<15?'শুভ দুপুর':h<18?'শুভ বিকেল':h<20?'শুভ সন্ধ্যা':'শুভ রাত্রি'; }

/* ================= স্টেট ================= */
let M = ymOf(today());
let TAB = 'dash';
let fCat = 'all', fAcc = 'all', fQ = '', setCat = 'exp';
let pendingRender = false;
const MONTH_TABS = ['dash','tx','rep','bud','sav','debt'];
const TITLES = {tx:'লেনদেন', rep:'মাসিক রিপোর্ট', bud:'বাজেট', sav:'সঞ্চয় লক্ষ্য', debt:'ঋণ ও কিস্তি', accs:'অ্যাকাউন্ট', recs:'নির্দিষ্ট মাসিক লেনদেন', sync:'ক্লাউড সিঙ্ক', set:'সেটিংস', guide:'গাইড'};

/* ================= হিসাব ইঞ্জিন ================= */
const accById = id => S.accs.find(a => a.id === id);
const accName = id => { const a = accById(id); return a ? a.name : '—'; };
function txOf(m){ return S.txns.filter(t => ymOf(t.d) === m); }
function actual(m){ const r = {inc:0,sav:0,bill:0,exp:0,debt:0,trf:0}; txOf(m).forEach(t => { r[t.c] = (r[t.c]||0) + t.a; }); r.out = r.sav+r.bill+r.exp+r.debt; r.net = r.inc - r.out; return r; }
function planned(m){ const b = S.budget[m] || {}; const r = {}; CK.forEach(c => { r[c] = Object.values(b[c]||{}).reduce((x,y)=>x+(+y||0),0); }); r.out = r.sav+r.bill+r.exp+r.debt; r.net = r.inc - r.out; return r; }
function accDelta(t, id){
  if(t.c === 'trf') return (t.to === id ? t.a : 0) - (t.acc === id ? t.a : 0);
  if(t.acc !== id) return 0;
  return t.c === 'inc' ? t.a : -t.a;
}
function accBal(id, before){ const A = accById(id); let b = A ? (+A.open||0) : 0; S.txns.forEach(t => { if(!before || t.d < before) b += accDelta(t, id); }); return b; }
function totBal(before){ return S.accs.reduce((s,a) => s + accBal(a.id, before), 0); }
function subsWithData(c, m){
  const set = new Set(S.subs[c]);
  txOf(m).forEach(t => { if(t.c===c) set.add(t.s); });
  Object.keys((S.budget[m]||{})[c]||{}).forEach(s => set.add(s));
  return [...set];
}
function ensureSub(c, name){ if(name && S.subs[c] && !S.subs[c].includes(name)){ S.subs[c].push(name); S.subsU = now(); } }
function renameSub(c, o, n){
  const Ls = S.subs[c]; if(Ls.includes(n)){ toast('এই নাম আগে থেকেই আছে'); return false; }
  const i = Ls.indexOf(o); if(i>=0) Ls[i] = n; else Ls.push(n);
  const t0 = now(); S.subsU = t0;
  S.txns.forEach(t => { if(t.c===c && t.s===o){ t.s = n; t.u = t0; } });
  S.recs.forEach(r => { if(r.c===c && r.s===o){ r.s = n; r.u = t0; } });
  Object.values(S.budget).forEach(b => { if(b[c] && o in b[c]){ b[c][n] = b[c][o]; delete b[c][o]; b.u = t0; } });
  if(c==='sav') S.goals.forEach(g => { if(g.name===o){ g.name = n; g.u = t0; } });
  if(c==='debt') S.loans.forEach(l => { if(l.name===o){ l.name = n; l.u = t0; } });
  return true;
}
function delRec(col, id){ S[col] = S[col].filter(x => x.id !== id); S.del[id] = now(); }
function goalCalc(g){
  const got = S.txns.filter(t => t.c==='sav' && t.s===g.name).reduce((a,t)=>a+t.a,0);
  const saved = (+g.start||0) + got, left = Math.max(0, g.target - saved);
  const ml = g.monthly>0 ? Math.ceil(left/g.monthly) : null;
  return {saved, left, pct: g.target>0 ? Math.min(1, saved/g.target) : 0, ml, done: ml!==null ? addM(ymOf(today()), ml) : null};
}
function loanCalc(Ln){
  const r = (Ln.apr||0)/1200, tm = ymOf(today()), paid = {};
  S.txns.forEach(t => { if(t.c==='debt' && t.s===Ln.name){ const m = ymOf(t.d); paid[m] = (paid[m]||0) + t.a; } });
  let bal = Ln.principal, m = Ln.start, rows = [], cur = null, never = false;
  for(let i=0; i<480; i++){
    if(bal <= 0.005) break;
    const open = bal, int = open*r, act = paid[m]||0; let pay;
    if(m < tm) pay = act;
    else if(m === tm){ pay = act>0 ? act : Math.min(Ln.pay, open+int); cur = Math.max(0, act>0 ? open+int-act : open); }
    else pay = Math.min(Ln.pay, open+int);
    if(m >= tm && !act && Ln.pay <= int){ never = true; break; }
    bal = Math.max(0, open + int - pay);
    rows.push({m, plan:Ln.pay, act, bal, done:act>0});
    m = addM(m,1);
  }
  if(cur === null) cur = tm < Ln.start ? Ln.principal : (never ? bal : 0);
  const totPaid = Object.values(paid).reduce((a,b)=>a+b,0);
  const payoff = (!never && rows.length && rows[rows.length-1].bal <= 0.005) ? rows[rows.length-1].m : null;

function insights(m){
  const a = actual(m), p = planned(m), pv = actual(addM(m,-1)), out = [], tm = ymOf(today());
  if(!a.inc && !a.out) return out;
  const sp = a.bill + a.exp, psp = pv.bill + pv.exp;
  if(psp > 0 && sp > 0){ const d = (sp - psp)/psp*100; out.push(Math.abs(d) < 1 ? ['➖', 'খরচ গত মাসের মতোই আছে'] : d > 0 ? ['📈', `গত মাসের চেয়ে খরচ <b class="neg">${Math.round(d)}% বেশি</b> (${mv(sp-psp)})`] : ['📉', `গত মাসের চেয়ে খরচ <b class="pos">${Math.round(-d)}% কম</b> — চমৎকার! 👏`]); }
  if(a.inc > 0){ const sr = a.sav/a.inc*100; out.push([sr>=20?'🌟':'🐷', `এই মাসে আয়ের <b>${Math.round(sr)}%</b> সঞ্চয় করেছেন${sr<20?' — ২০% লক্ষ্য রাখার চেষ্টা করুন':''}`]); }
  const bySub = {}; txOf(m).forEach(t => { if(t.c==='exp'||t.c==='bill') bySub[t.s] = (bySub[t.s]||0) + t.a; });
  const top = Object.entries(bySub).sort((x,y)=>y[1]-x[1])[0];
  if(top && sp > 0) out.push(['🏷️', `সবচেয়ে বেশি খরচ: <b>${esc(top[0])}</b> — ${mv(top[1])} (${Math.round(top[1]/sp*100)}%)`]);
  const b = S.budget[m] || {}, overs = [];
  ['bill','exp'].forEach(c => Object.entries(b[c]||{}).forEach(([s,v]) => { const ac = txOf(m).filter(t=>t.c===c&&t.s===s).reduce((x,t)=>x+t.a,0); if(v>0 && ac>v) overs.push(s); }));
  if(overs.length) out.push(['⚠️', `${overs.length}টি খাতে বাজেট ছাড়িয়েছে: <b>${overs.slice(0,3).map(esc).join(', ')}</b>${overs.length>3?' ...':''}`]);
  if(m === tm && sp > 0){ const d = new Date().getDate(), proj = sp/d*dim(m); out.push(['🔮', `এভাবে চললে মাস শেষে বিল+খরচ হবে প্রায় <b>${mv(Math.round(proj))}</b>${p.bill+p.exp>0 ? (proj > p.bill+p.exp ? ' — <span class="neg">বাজেটের বেশি</span>' : ' — <span class="pos">বাজেটের মধ্যে</span>') : ''}`]); }
  return out;
}

/* ================= চার্ট ================= */
function prep(cv){
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = +cv.dataset.h;
  cv.style.height = h+'px'; cv.width = w*dpr; cv.height = h*dpr;
  const x = cv.getContext('2d'); x.scale(dpr,dpr); x.font = '10px system-ui'; return [x,w,h];
}
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); for(const m of [1,2,2.5,5,10]) if(m*p >= v) return m*p; return 10*p; }
function grid(x, w, h, pl, pt, pb, pr, max, min){
  min = min || 0; const mu = cssv('--mu'), bd = cssv('--bd');
  for(let i=0;i<=4;i++){ const v = min + (max-min)*i/4, y = pt+(h-pt-pb)*(1-i/4);
    x.strokeStyle = bd; x.lineWidth = 1; x.beginPath(); x.moveTo(pl,y); x.lineTo(w-pr,y); x.stroke();
    x.fillStyle = mu; x.textAlign = 'right'; x.font = '10px system-ui'; x.fillText(L.hide ? '•••' : short(v), pl-5, y+3); }
}
function rbar(x, X, Y, W, H, col){ if(H<=0.5) return; x.fillStyle = col; x.beginPath(); if(x.roundRect) x.roundRect(X, Y, W, H, [4,4,0,0]); else x.rect(X, Y, W, H); x.fill(); }
function drawCharts(){
  const tx = cssv('--tx'), mu = cssv('--mu');
  const cb = $('#cBar');
  if(cb && cb.clientWidth > 40){
    const a = actual(M), p = planned(M), A = CK.map(c=>p[c]), B = CK.map(c=>a[c]);
    const [x,w,h] = prep(cb), pl = 40, pb = 24, pt = 12, pr = 6, max = niceMax(Math.max(1,...A,...B));
    grid(x,w,h,pl,pt,pb,pr,max);
    const gw = (w-pl-pr)/CK.length, bw = Math.min(20, gw*.32), ih = h-pt-pb;
    CK.forEach((c,i) => { const cx = pl+gw*i+gw/2;
      rbar(x, cx-bw-1, h-pb-ih*A[i]/max, bw, ih*A[i]/max, cssv('--plan'));
      rbar(x, cx+1, h-pb-ih*B[i]/max, bw, ih*B[i]/max, cssv('--act'));
      x.fillStyle = tx; x.textAlign = 'center'; x.font = '11px system-ui'; x.fillText(CATS[c].bn.split(' ')[0], cx, h-7); });
  }
  const cd = $('#cDonut');
  if(cd && cd.clientWidth > 40){
    const it = donutItems(M), tot = it.reduce((a,b)=>a+b.v,0), [x,w,h] = prep(cd);
    const cx = w/2, cy = h/2, R = Math.min(w,h)/2-4, r = R*.64;
    if(!tot){ x.strokeStyle = cssv('--bd'); x.lineWidth = R-r; x.beginPath(); x.arc(cx,cy,(R+r)/2,0,Math.PI*2); x.stroke();
      x.fillStyle = mu; x.textAlign = 'center'; x.font = '13px system-ui'; x.fillText('এখনো খরচ নেই', cx, cy+4); $('#dLeg').innerHTML = ''; }
    else {
      let a0 = -Math.PI/2;
      it.forEach(o => { const da = o.v/tot*Math.PI*2; x.beginPath(); x.moveTo(cx,cy); x.arc(cx,cy,R,a0,a0+da); x.closePath(); x.fillStyle = o.col; x.fill(); a0 += da; });
      x.globalCompositeOperation = 'destination-out'; x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.fill(); x.globalCompositeOperation = 'source-over';
      x.fillStyle = tx; x.textAlign = 'center'; x.font = '700 15px system-ui'; x.fillText(L.hide ? '৳ ••••' : fmt(tot), cx, cy+3);
      x.fillStyle = mu; x.font = '11px system-ui'; x.fillText('মোট', cx, cy+19);
      $('#dLeg').innerHTML = it.map(o => `<div><span><i style="background:${o.col}"></i>${esc(o.l)}</span><span>${mv(o.v)} · ${Math.round(o.v/tot*100)}%</span></div>`).join('');
    }
  }
  const cdy = $('#cDaily');
  if(cdy && cdy.clientWidth > 40){
    const n = dim(M), vals = Array(n).fill(0);
    txOf(M).forEach(t => { if(t.c==='bill'||t.c==='exp') vals[+t.d.slice(8)-1] += t.a; });
    const [x,w,h] = prep(cdy), pl = 36, pb = 20, pt = 10, pr = 4, max = niceMax(Math.max(1,...vals)), ih = h-pt-pb;
    grid(x,w,h,pl,pt,pb,pr,max);
    const gw = (w-pl-pr)/n, bw = Math.max(2, gw*.7);
    vals.forEach((v,i) => { rbar(x, pl+gw*i+(gw-bw)/2, h-pb-ih*v/max, bw, ih*v/max, cssv('--act'));
      if((i+1)%5===0 || i===0){ x.fillStyle = mu; x.textAlign = 'center'; x.font = '10px system-ui'; x.fillText(String(i+1), pl+gw*i+gw/2, h-6); } });
    const tm = ymOf(today()), days = M===tm ? new Date().getDate() : M<tm ? n : 0;
    if(days){ const avg = vals.reduce((a,b)=>a+b,0)/days, y = h-pb-ih*avg/max;
      x.strokeStyle = cssv('--gold'); x.lineWidth = 2; x.setLineDash([5,4]); x.beginPath(); x.moveTo(pl,y); x.lineTo(w-pr,y); x.stroke(); x.setLineDash([]); }
  }
  const ctr = $('#cTrend');
  if(ctr && ctr.clientWidth > 40){
    const ms = []; for(let k=11;k>=0;k--) ms.push(addM(M,-k));
    const AA = ms.map(m=>actual(m)), I = AA.map(a=>a.inc), O = AA.map(a=>a.out), N = AA.map(a=>a.net);
    const [x,w,h] = prep(ctr), pl = 40, pb = 22, pt = 12, pr = 6;
    const max = niceMax(Math.max(1,...I,...O)), mn = Math.min(0,...N), min = mn<0 ? -niceMax(-mn) : 0;
    grid(x,w,h,pl,pt,pb,pr,max,min);
    const Y = v => pt+(h-pt-pb)*(1-(v-min)/(max-min)), gw = (w-pl-pr)/12, bw = Math.max(3, gw*.3), y0 = Y(0);
    ms.forEach((m,i) => { const cx = pl+gw*i+gw/2;
      rbar(x, cx-bw-.5, Y(I[i]), bw, y0-Y(I[i]), '#16a05a'); rbar(x, cx+.5, Y(O[i]), bw, y0-Y(O[i]), cssv('--act'));
      x.fillStyle = m===M ? tx : mu; x.textAlign = 'center'; x.font = (m===M?'700 ':'')+'9.5px system-ui'; x.fillText(MS[+m.slice(5)-1], cx, h-6); });
    x.strokeStyle = cssv('--gold'); x.lineWidth = 2.2; x.beginPath();
    N.forEach((v,i) => { const px = pl+gw*i+gw/2; if(i) x.lineTo(px, Y(v)); else x.moveTo(px, Y(v)); }); x.stroke();
    N.forEach((v,i) => { x.fillStyle = cssv('--gold'); x.beginPath(); x.arc(pl+gw*i+gw/2, Y(v), 3, 0, Math.PI*2); x.fill(); });
  }
}

function txForm(t, preset){

    if(D.c){ c = D.c; if(c!=='trf' && !S.subs[c].includes(s)) s = ''; if(c==='trf' && (!to || to===acc)) to = other(acc); sq = '';

    if(t && t.rid) rec.rid = t.rid;

    if(c!=='trf'){ L.lastAcc = acc; saveL(); }

    if(more){ txForm(null, c); const nf = $('#ov .sheet'); nf.querySelector('#fD').value = d; } else closeSheet(true);
  };

}

function accFix(id){
  const ac = accById(id), cur = accBal(id, null);
  const v = prompt(`${ac.name}-এ এখন আসলে কত টাকা আছে?\n(অ্যাপে দেখাচ্ছে: ${fmt(cur)})`); if(v===null) return;
  const real = evalAmt(v); if(isNaN(real)){ toast('সঠিক অঙ্ক লিখুন'); return; }
  const diff = r2(real - cur); if(!diff){ toast('✅ আগে থেকেই মিলে আছে'); return; }
  const c = diff > 0 ? 'inc' : 'exp', s = 'হিসাব সমন্বয়'; ensureSub(c, s);
  S.txns.push({id:uid(), d:today(), a:Math.abs(diff), c, s, n:'ব্যালেন্স মিলানো', acc:id, u:now()});
  save(); render(); toast(`✅ ${fmt(Math.abs(diff))} ${diff>0?'যোগ':'বাদ'} করে মিলানো হয়েছে`);
}

let syncState = 'idle', syncErr = '', syncing = false, syncAgain = false, syncT = null, syncChain = 0;

async function post(body){
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 30000);
  try{
    const r = await fetch(L.sync.url, {method:'POST', body:JSON.stringify(Object.assign({secret:L.sync.key}, body)), headers:{'Content-Type':'text/plain;charset=utf-8'}, redirect:'follow', signal:ctl.signal});
    const txt = await r.text(); let j;
    try{ j = JSON.parse(txt); }catch(e){ throw new Error('সার্ভার থেকে সঠিক উত্তর আসেনি — Deploy করার সময় "Who has access: Anyone" দিয়েছেন কিনা দেখুন'); }
    if(!j.ok) throw new Error(j.err==='auth' ? 'Secret Key মিলেনি — Apps Script কোডের SECRET আর এখানের Key একই হতে হবে' : (j.err || 'অজানা সমস্যা'));
    return j;
  } catch(e){
    if(e.name==='AbortError') throw new Error('সার্ভার সাড়া দিচ্ছে না (টাইমআউট)');
    if(e instanceof TypeError) throw new Error(navigator.onLine ? 'সংযোগ হয়নি — URL ঠিক আছে কিনা দেখুন' : 'ইন্টারনেট নেই');
    throw e;
  } finally{ clearTimeout(tm); }
}
async function sync(manual, chained){
  if(!L.sync.url || !L.sync.key){ if(manual) toast('আগে ক্লাউড সিঙ্ক সেটআপ করুন'); return; }
  if(syncing){ syncAgain = true; return; }
  syncChain = chained ? syncChain + 1 : 0;
  syncing = true; setSync('busy');
  try{
    const before = JSON.stringify(S);
    const res = await post({action:'sync', data:S});
    const server = normalize(res.data || {});
    S = normalize(mergeData(S, server));   // রিকোয়েস্ট চলাকালীন লোকাল পরিবর্তনও রক্ষা পায়
    saveLocal(); L.sync.last = now(); saveL();
    setSync('ok'); if(manual) toast('☁️ সিঙ্ক সম্পন্ন');
    if(JSON.stringify(S) !== before){
      const ae = document.activeElement;
      if($('#ov') || (ae && (ae.classList.contains('bin') || ae.id==='txQ'))) pendingRender = true; else render();
    }
    // সার্ভারে যা নেই এমন লোকাল পরিবর্তন থাকলে আবার পাঠাও (সর্বোচ্চ ২ বার)
    if(JSON.stringify(normalize(mergeData(server, S))) !== JSON.stringify(server) && syncChain < 2) syncAgain = true;
  }catch(e){ setSync(navigator.onLine ? 'err' : 'off', e.message); if(manual) toast('⚠️ ' + e.message); }
  finally{ syncing = false; if(syncAgain){ syncAgain = false; setTimeout(() => sync(false, true), 800); } }
}

function gasCode(){
  return `/***** আমার হিসাব — ক্লাউড সিঙ্ক সার্ভার (Google Apps Script) *****
 * সেটআপ: Deploy > New deployment > Web app > Execute as: Me > Who has access: Anyone
 * নিচের SECRET অ্যাপের Secret Key এর সাথে হুবহু মিলতে হবে।
 */
const SECRET = ${JSON.stringify(L.sync.key || 'এখানে-আপনার-গোপন-কী-লিখুন')};
const FILE_NAME = 'AMAR_HISHAB_DATA.json';
const BK_FOLDER = 'AmarHishab_Backups';
const KEEP_BK = 30;

function doGet(){ return out_({ok:true, app:'Amar Hishab', msg:'সার্ভার চালু আছে'}); }

function doPost(e){
  let req;
  try{ req = JSON.parse(e.postData.contents); }catch(err){ return out_({ok:false, err:'bad json'}); }
  if(req.secret !== SECRET) return out_({ok:false, err:'auth'});
  const lock = LockService.getScriptLock(); lock.waitLock(25000);
  try{
    const f = file_(); let cur = {};
    try{ cur = JSON.parse(f.getBlob().getDataAsString() || '{}'); }catch(err){ cur = {}; }
    if(req.action === 'ping') return out_({ok:true, count:(cur.txns||[]).length, time:Date.now()});
    if(req.action === 'pull') return out_({ok:true, data:cur});
    if(req.action === 'sync'){
      const m = mergeData(cur, req.data || {});
      f.setContent(JSON.stringify(m)); backup_(f, false);
      return out_({ok:true, data:m});
    }
    if(req.action === 'replace'){ backup_(f, true); f.setContent(JSON.stringify(req.data || {})); return out_({ok:true}); }
    return out_({ok:false, err:'unknown action'});
  } finally { lock.releaseLock(); }
}
function file_(){
  const p = PropertiesService.getScriptProperties(), id = p.getProperty('FILE_ID');
  if(id){ try{ return DriveApp.getFileById(id); }catch(e){} }
  const f = DriveApp.createFile(FILE_NAME, '{}', MimeType.PLAIN_TEXT);
  p.setProperty('FILE_ID', f.getId()); return f;
}
function backup_(f, force){
  const p = PropertiesService.getScriptProperties(), d = Utilities.formatDate(new Date(), 'Asia/Dhaka', 'yyyy-MM-dd');
  if(!force && p.getProperty('LAST_BK') === d) return;
  p.setProperty('LAST_BK', d);
  const it = DriveApp.getFoldersByName(BK_FOLDER), fo = it.hasNext() ? it.next() : DriveApp.createFolder(BK_FOLDER);
  f.makeCopy('AmarHishab_' + Utilities.formatDate(new Date(), 'Asia/Dhaka', 'yyyy-MM-dd_HHmm') + '.json', fo);
  const all = [], fi = fo.getFiles(); while(fi.hasNext()) all.push(fi.next());
  all.sort(function(a,b){ return b.getDateCreated() - a.getDateCreated(); }).slice(KEEP_BK).forEach(function(x){ x.setTrashed(true); });
}
function out_(o){ return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }

/* অ্যাপের মার্জ ইঞ্জিন — হুবহু একই কোড */
${mergeData.toString()}
`;

    case 'csvM': exportCSV(txOf(M), `Hishab_${M}.csv`); break;
    case 'csvA': exportCSV(S.txns, `Hishab_All_${today()}.csv`); break;
    case 'backup': download(`Amar_Hishab_Backup_${today()}.json`, JSON.stringify(S), 'application/json'); break;
    case 'restore': restore(); break;
    case 'wipe': wipeAll(); break;
    case 'pin': pinSetup(); break;
    case 'syncNow': sync(true); break;
    case 'syncSave': {
      L.sync.url = $('#syU').value.trim(); L.sync.key = $('#syK').value.trim(); L.sync.auto = $('#syA').checked; saveL();
      if(!L.sync.url || !L.sync.key){ setSync('idle'); render(); toast(L.sync.key ? '✅ Key সেভ হয়েছে — এবার কোড কপি করে সেটআপ করুন' : 'URL আর Secret Key দুটোই দিন'); return; }
      if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(L.sync.url)) toast('URL টা script.google.com এর হওয়া উচিত');
      setSync('busy'); toast('⏳ সংযোগ পরীক্ষা হচ্ছে...');
      post({action:'ping'}).then(r => { toast(`✅ সংযোগ সফল! ক্লাউডে ${r.count}টি লেনদেন আছে`); setSync('ok'); sync(false); })
        .catch(e => { setSync('err', e.message); toast('⚠️ ' + e.message); });
      break; }
    case 'copyGas': if(!L.sync.key){ toast('আগে একটা Secret Key লিখে সেভ করুন'); return; } copyText(gasCode(), '📋 Apps Script কোড কপি হয়েছে'); break;
    case 'install': if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } break;
    case 'forcePull': forcePull(); break;
    case 'forcePush': forcePush(); break;
  }
}
$('#view').addEventListener('input', e => { if(e.target.id==='txQ'){ fQ = e.target.value; drawTxList(); } });
$('#view').addEventListener('change', e => {
  const el = e.target;
  if(el.id==='stName'){ L.name = el.value.trim(); saveL(); toast('✅ সেভ হয়েছে'); }
  else if(el.id==='stHide'){ L.hide = el.checked; saveL(); applyTheme(); }
  else if(el.classList.contains('bin')){
    const c = el.dataset.c, s = el.dataset.s, v = num(el.value);
    S.budget[M] = S.budget[M] || {}; S.budget[M][c] = S.budget[M][c] || {};
    if(v>0) S.budget[M][c][s] = v; else delete S.budget[M][c][s]; S.budget[M].u = now(); save();
    // পুরো রেন্ডার না করে শুধু এই সারি আপডেট — যাতে পরের ঘরে ফোকাস না হারায়
    const row = el.closest('.brow'), card = el.closest('.card');
    const ac = txOf(M).filter(t=>t.c===c && t.s===s).reduce((a,t)=>a+t.a,0);
    const pct = v>0 ? Math.min(100, ac/v*100) : (ac>0?100:0), bad = c!=='inc' && v>0 && ac>v;
    const bi = row.querySelector('.bar i'); bi.style.width = pct+'%'; bi.style.background = bad ? 'var(--red)' : CATS[c].col;
    row.querySelector('.ba').classList.toggle('over', bad);
    card.querySelector('.ch small').textContent = fmt(actual(M)[c]) + ' / ' + fmt(planned(M)[c]);
  }
});
$('#view').addEventListener('focusout', e => { if(pendingRender && (e.target.classList.contains('bin') || e.target.id==='txQ')) setTimeout(() => { if(pendingRender && !$('#ov') && !(document.activeElement && document.activeElement.classList.contains('bin'))) render(); }, 300); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeSheet(); });
let rsT; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(drawCharts, 150); });
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ hiddenAt = now(); }
  else { if(L.pin && hiddenAt && now()-hiddenAt > 60000) lockScreen(); if(L.sync.auto) sync(false); }
});
window.addEventListener('online', () => { if(L.sync.auto) sync(false); });
setInterval(() => { if(!document.hidden && L.sync.auto && L.sync.url) sync(false); }, 60000);
if(window.matchMedia){ const mq = window.matchMedia('(prefers-color-scheme: dark)'); if(mq.addEventListener) mq.addEventListener('change', () => requestAnimationFrame(drawCharts)); }

/* ================= PWA ================= */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if(['dash','set'].includes(TAB) && !$('#ov')) render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('🎉 অ্যাপ ইনস্টল হয়েছে!'); render(); });
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ================= শুরু ================= */
applyTheme();
render();
setSync('idle');
lockScreen();
if(L.sync.url && L.sync.key && L.sync.auto) setTimeout(() => sync(false), 600);
</script>
</body>
